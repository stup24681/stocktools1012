name: Daily Stock Screener Runner

on:
schedule:
# 台灣時間週一至週五 16:05 (UTC 08:05) 自動觸發
- cron: '5 8 * * 1-5'
workflow_dispatch: # 支援在 GitHub 網頁上手動點擊一鍵執行

jobs:
run-screener:
runs-on: ubuntu-latest
permissions:
contents: write # 允許自動 Commit 與 Push 更新 data.json

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests pandas yfinance

  - name: Run Quantitative Screener
    run: |
      python fetch_stocks.py

  - name: Commit and Push Updated data.json
    run: |
      git config --local user.email "action@github.com"
      git config --local user.name "GitHub Action Bot"
      git add data.json
      git commit -m "Auto-update market data: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
      git push
      
