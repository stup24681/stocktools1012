            entryPrice: "365.0 美元", breakoutConfirmPrice: "405.0 美元", stopLossPrice: "335.0 美元", stopLossNum: 335.0, noBuyCondition: "大漲噴出嚴禁追高；跌破 335 美元結構失效嚴禁抄底", score: 96
          }]
        },
        "2026-10-05": {
          date: "2026-10-05", dayOfWeek: "一", taiexClose: "27,477.31", taiexChange: "+286.45", taiexPercent: "+1.05%", taiexVolume: "52.9 億股",
          secondaryIndexName: "費城半導體 (SOX)", secondaryIndexClose: "13,172.74 (+0.27%)", marketNature: "美股全面走強 ‧ 網通與光互聯晶片率先創高",
          sectors: [{ name: "高速傳輸 / 光互連", grade: "S級", note: "MRVL 與 CRDO 齊步上攻" }],
          candidates: [{
            rank: 1, code: "MRVL", name: "Marvell Technology", sector: "高速傳輸/光互連", close: 271.25, change: "-0.38%", volume: "12,900,000", volRatio: "1.82 倍",
            maStatus: "均線多頭排列", boxDays: "20日箱型突破", boxRange: "240.0～260.0", breakoutPrice: "260.0", breakoutReason: "守穩 260 美元頸線，蓄勢挑戰 280 美元波段新高。",
            fib236: 264.3, fib382: 254.8, fib500: 247.2, fib618: 239.5, fib786: 228.6, strategy: "等38.2%", entryZone: "254.0 ～ 264.0 美元", entryMin: 254.0, entryMax: 264.0,
            entryPrice: "260.0 美元", breakoutConfirmPrice: "282.0 美元", stopLossPrice: "238.0 美元", stopLossNum: 238.0, noBuyCondition: "現價 271.25 美元高於進場區，耐心等回踩；破 238 停損", score: 93
          }]
        }
      }
    };

    let appState = { currentMarket: "TW", db: fallbackDb, activeDate: "2026-10-08" };

    async function loadLiveDataJson() {
      try {
        const res = await fetch('data.json?t=' + new Date().getTime());
        if (res.ok) {
          const liveData = await res.json();
          if (liveData) {
            if (liveData.TW) appState.db.TW = { ...fallbackDb.TW, ...liveData.TW };
            if (liveData.US) appState.db.US = { ...fallbackDb.US, ...liveData.US };
            document.getElementById('data-source-badge').innerText = "雲端即時同步 (data.json)";
            showToast("已成功載入官方最新 data.json！");
          }
        }
      } catch (err) {}
      initRender();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    function getAllMarketDates() {
      const marketDb = appState.db[appState.currentMarket] || {};
      return Object.keys(marketDb).sort().reverse();
    }

    function getDisplayTradingDays() {
      return getAllMarketDates().slice(0, 5);
    }

    function renderDayTabs() {
      const displayDates = getDisplayTradingDays();
      if (!displayDates.includes(appState.activeDate)) {
        appState.activeDate = displayDates[0] || (appState.currentMarket === 'US' ? '2026-10-09' : '2026-10-08');
      }
      const container = document.getElementById('day-tabs-container');
      const marketDb = appState.db[appState.currentMarket] || {};

      container.innerHTML = displayDates.map((dStr) => {
        const item = marketDb[dStr] || {};
        const count = item.candidates ? item.candidates.length : 0;
        const isActive = dStr === appState.activeDate;
        return `
          <button data-date="${dStr}" class="day-tab-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold transition border shrink-0 ${
            isActive ? 'bg-indigo-600 text-white border-indigo-500 shadow-md' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-slate-200'
          }">
            <i data-lucide="calendar" class="w-3 h-3"></i>
            <span>${dStr} (${item.dayOfWeek || '交易日'})</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded font-mono font-bold ${
              isActive ? 'bg-indigo-950 text-indigo-200' : (count > 0 ? 'bg-indigo-500/20 text-indigo-300' : 'bg-slate-800 text-slate-500')
            }">${count}檔</span>
          </button>
        `;
      }).join('');

      document.querySelectorAll('.day-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.activeDate = btn.getAttribute('data-date');
          renderDayTabs();
          renderActiveView();
        });
      });
      lucide.createIcons();
    }

    function renderEntryZoneAlert() {
      const container = document.getElementById('entry-zone-list');
      const marketDb = appState.db[appState.currentMarket] || {};
      const allDates = getAllMarketDates();
      const tenTradingDays = allDates.slice(0, 10);
      const isUS = appState.currentMarket === "US";
      const unit = isUS ? "美元" : "元";

      const chronologicalDates = [...tenTradingDays].reverse();
      const candidateTracker = {};

      chronologicalDates.forEach(dStr => {
        const day = marketDb[dStr];
        if (day && day.candidates) {
          day.candidates.forEach(c => {
            candidateTracker[c.code] = { ...c, stoppedOut: false, lastSelectedDate: dStr };
          });
        }
      });

      const latestDateStr = tenTradingDays[0];
      const latestDay = marketDb[latestDateStr] || {};
      const currentPriceMap = {};
      if (latestDay.candidates) {
        latestDay.candidates.forEach(c => { currentPriceMap[c.code] = c.close; });
      }

      const qualified = [];
      Object.values(candidateTracker).forEach(c => {
        const currentPrice = currentPriceMap[c.code] !== undefined ? currentPriceMap[c.code] : c.close;
        if (currentPrice <= c.stopLossNum) {
          c.stoppedOut = true;
          return;
        }
        if (!c.stoppedOut && currentPrice >= c.entryMin && currentPrice <= c.entryMax) {
          qualified.push({ ...c, verifiedCurrentPrice: currentPrice });
        }
      });

      if (qualified.length === 0) {
        container.innerHTML = `
          <div class="p-4 rounded-xl bg-slate-950/70 border border-slate-800 text-center flex flex-col items-center justify-center py-5">
            <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 mb-1.5">
              <i data-lucide="shield-check" class="w-4 h-4 text-indigo-400"></i>
            </div>
            <div class="text-sm font-bold text-slate-200">暫無上榜</div>
            <p class="text-[11px] text-slate-500 mt-1 max-w-md">${isUS ? '美股' : '台股'}近10日所有候選股票目前皆脫離最佳進場區（漲離或未回踩到位）或已跌破停損點。依量化紀律嚴禁追高與接刀。</p>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5">
            ${qualified.map(q => `
              <div class="p-3.5 rounded-xl bg-emerald-950/40 border border-emerald-500/60 shadow-lg flex items-center justify-between">
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="text-sm font-bold text-white">${q.name}</span>
                    <span class="text-xs font-mono px-1.5 py-0.5 rounded bg-emerald-900/60 text-emerald-300 font-bold">${q.code}</span>
                    <span class="text-[9px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold">觸及進場區</span>
                  </div>
                  <div class="text-xs text-slate-300 mt-1">進場區間：<b class="text-emerald-300">${q.entryZone}</b></div>
                  <div class="text-xs text-slate-300">核心買價：<b class="text-white">${q.entryPrice}</b></div>
                </div>
                <div class="text-right">
                  <div class="text-[10px] text-slate-400">最新價格</div>
                  <div class="text-lg font-bold font-mono text-emerald-400">${q.verifiedCurrentPrice} ${unit}</div>
                  <div class="text-[9px] text-rose-400 font-bold">嚴格停損: ${q.stopLossPrice}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      lucide.createIcons();
    }

    function renderActiveView() {
      const marketDb = appState.db[appState.currentMarket] || {};
      const dayData = marketDb[appState.activeDate] || {
        date: appState.activeDate, dayOfWeek: "--", taiexClose: "--", taiexChange: "--", taiexPercent: "--", taiexVolume: "--",
        marketNature: "無資料", sectors: [], candidates: []
      };
      const isUS = appState.currentMarket === "US";
      document.getElementById('label-market-date').innerText = `${dayData.date} (${dayData.dayOfWeek}) 盤後`;
      document.getElementById('macro-section-title').innerText = isUS ? "一、美股市場結論與指數結構 (那指 / 費半)" : "一、今日市場結論與大盤價量結構";

      const grid = document.getElementById('macro-index-grid');
      const changeClass = dayData.taiexChange && dayData.taiexChange.startsWith('+') ? 'text-rose-400' : 'text-emerald-400';
      grid.innerHTML = `
        <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800">
          <div class="text-[10px] text-slate-400">${isUS ? '那斯達克指數 (NASDAQ)' : '加權指數 (TAIEX)'}</div>
          <div class="text-base font-bold font-mono text-white mt-1">${dayData.taiexClose}</div>
          <div class="text-[11px] font-mono mt-0.5 font-semibold ${changeClass}">${dayData.taiexChange} (${dayData.taiexPercent})</div>
        </div>
        <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800">
          <div class="text-[10px] text-slate-400">${isUS ? (dayData.secondaryIndexName || '費城半導體 (SOX)') : '大盤成交金額'}</div>
          <div class="text-base font-bold font-mono text-white mt-1">${isUS ? (dayData.secondaryIndexClose || '12,572.42') : dayData.taiexVolume}</div>
          <div class="text-[10px] text-slate-500 mt-0.5">${isUS ? '半導體強弱核心指標' : '上市集中市場'}</div>
        </div>
        <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800">
          <div class="text-[10px] text-slate-400">盤勢特徵</div>
          <div class="text-xs font-bold text-indigo-300 mt-1 truncate">${dayData.marketNature}</div>
          <div class="text-[10px] text-slate-500 mt-0.5">多空架構解析</div>
        </div>
        <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800">
          <div class="text-[10px] text-slate-400">符合檔數</div>
          <div class="text-base font-bold font-mono text-white mt-1">${dayData.candidates ? dayData.candidates.length : 0} 檔符合</div>
          <div class="text-[10px] text-slate-500 mt-0.5">嚴守上限5檔‧寧缺勿濫</div>
        </div>
      `;

      const secBox = document.getElementById('market-sectors-container');
      if (dayData.sectors && dayData.sectors.length > 0) {
        secBox.innerHTML = dayData.sectors.map(s => `
          <div class="px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-800 text-xs flex items-center gap-1.5">
            <span class="font-bold px-1.5 py-0.5 rounded text-[9px] bg-amber-500/20 text-amber-300 border border-amber-500/30">${s.grade}</span>
            <span class="text-white font-medium">${s.name}</span>
            <span class="text-slate-400 text-[10px]">— ${s.note}</span>
          </div>
        `).join('');
      } else {
        secBox.innerHTML = `<span class="text-xs text-slate-500">當日無明確 S/A 級共振族群</span>`;
      }

      const tableWrapper = document.getElementById('candidates-table-wrapper');
      if (!dayData.candidates || dayData.candidates.length === 0) {
        tableWrapper.innerHTML = `<div class="py-8 text-center text-xs text-slate-500 border border-dashed border-slate-800 rounded-xl">今日沒有符合完整量化模型的股票（寧缺勿濫）</div>`;
      } else {
        tableWrapper.innerHTML = `
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead>
              <tr class="text-slate-400 border-b border-slate-800 bg-slate-950">
                <th class="py-2 px-3">排名</th><th class="py-2 px-3">代號</th><th class="py-2 px-3">名稱</th>
                <th class="py-2 px-3">收盤</th><th class="py-2 px-3">漲跌</th><th class="py-2 px-3">量能倍數</th>
                <th class="py-2 px-3">最佳進場區</th><th class="py-2 px-3">核心買價</th><th class="py-2 px-3 text-rose-400">停損價</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/60 font-mono">
              ${dayData.candidates.map(c => `
                <tr class="hover:bg-slate-800/40">
                  <td class="py-2.5 px-3 font-bold text-slate-300">#${c.rank}</td>
                  <td class="py-2.5 px-3 font-bold text-indigo-400">${c.code}</td>
                  <td class="py-2.5 px-3 font-sans font-bold text-white">${c.name}</td>
                  <td class="py-2.5 px-3 font-bold text-white">${c.close}</td>
                  <td class="py-2.5 px-3 font-bold ${c.change && c.change.startsWith('+') ? 'text-rose-400' : 'text-emerald-400'}">${c.change}</td>
                  <td class="py-2.5 px-3 font-sans text-indigo-300">${c.volRatio}</td>
                  <td class="py-2.5 px-3 font-sans text-emerald-400 font-semibold">${c.entryZone}</td>
                  <td class="py-2.5 px-3 font-bold text-white">${c.entryPrice}</td>
                  <td class="py-2.5 px-3 text-rose-400 font-bold">${c.stopLossPrice}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      const cardsBox = document.getElementById('candidate-cards-container');
      if (!dayData.candidates || dayData.candidates.length === 0) {
        cardsBox.innerHTML = `<div class="p-4 rounded-xl bg-slate-900 text-center text-xs text-slate-500">當日無標的詳細資料。</div>`;
      } else {
        cardsBox.innerHTML = dayData.candidates.map(c => `
          <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-3">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800">
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold font-mono">#${c.rank}</span>
                <span class="text-base font-bold text-white">${c.name} (${c.code})</span>
                <span class="text-xs text-slate-400">${c.sector}</span>
              </div>
              <span class="text-sm font-bold font-mono text-amber-300">${c.score} 分</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
              <div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 space-y-1">
                <div class="text-indigo-300 font-bold">均線與突破型態</div>
                <div class="text-slate-300">${c.maStatus}</div>
                <div class="text-slate-400">${c.breakoutReason}</div>
              </div>
              <div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 space-y-1">
                <div class="text-indigo-300 font-bold">進出場紀律</div>
                <div class="text-emerald-300">最佳進場區：${c.entryZone}（核心 ${c.entryPrice}）</div>
                <div class="text-rose-400">${c.noBuyCondition}</div>
              </div>
            </div>
          </div>
        `).join('');
      }
      lucide.createIcons();
    }

    function initRender() {
      renderDayTabs();
      renderActiveView();
      renderEntryZoneAlert();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadLiveDataJson();
      document.getElementById('btn-sync-data').addEventListener('click', loadLiveDataJson);
      const btnTw = document.getElementById('btn-market-tw');
      const btnUs = document.getElementById('btn-market-us');
      btnTw.addEventListener('click', () => {
        appState.currentMarket = "TW";
        btnTw.className = "flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm";
        btnUs.className = "flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold transition-all text-slate-400 hover:text-slate-200";
        initRender();
      });
      btnUs.addEventListener('click', () => {
        appState.currentMarket = "US";
        btnUs.className = "flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm";
        btnTw.className = "flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold transition-all text-slate-400 hover:text-slate-200";
        initRender();
      });
    });
  </script>
</body>
</html>
