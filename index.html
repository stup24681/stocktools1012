<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>台美股盤後量化選股助手 (自動同步版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            twRed: '#ef4444',
            twGreen: '#22c55e',
            slateDark: '#0b0f19',
            cardDark: '#111827',
            cardBorder: '#1f2937'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-600 selection:text-white pb-12">
  <header class="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-rose-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 shrink-0">
            <i data-lucide="shield-check" class="w-4 h-4"></i>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <h1 class="text-sm sm:text-base font-bold text-white tracking-tight truncate">台美股量化選股</h1>
              <span id="data-source-badge" class="text-[9px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                連線就緒
              </span>
            </div>
            <p class="text-[10px] text-slate-400 truncate">近10日量化監控 ＋ 停損嚴格剔除 ＋ 每日 16:05 自動結算</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <div class="flex items-center p-0.5 rounded-lg bg-slate-900 border border-slate-800">
            <button id="btn-market-tw" class="flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm">
              <span>🇹🇼 台股</span>
            </button>
            <button id="btn-market-us" class="flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold transition-all text-slate-400 hover:text-slate-200">
              <span>🇺🇸 美股</span>
            </button>
          </div>
          <button id="btn-sync-data" class="p-2 sm:px-2.5 sm:py-1.5 rounded-lg bg-emerald-800/80 hover:bg-emerald-700 text-white text-xs font-semibold flex items-center gap-1 transition" title="從雲端重新載入 data.json">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            <span class="hidden md:inline">同步數據</span>
          </button>
        </div>
      </div>
    </div>
  </header>
  <main class="flex-1 max-w-7xl mx-auto w-full px-3 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">
    <div class="flex items-center pb-2 border-b border-slate-800">
      <div class="flex items-center gap-1.5 overflow-x-auto py-1 scrollbar-none w-full" id="day-tabs-container"></div>
    </div>
    <div class="rounded-2xl bg-gradient-to-r from-slate-900 via-indigo-950/40 to-slate-900 border border-indigo-500/40 p-4 sm:p-5 shadow-xl relative overflow-hidden">
      <div class="flex items-center gap-2.5 mb-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-600/30 border border-indigo-500/50 flex items-center justify-center text-indigo-400 shrink-0">
          <i data-lucide="target" class="w-4 h-4"></i>
        </div>
        <div>
          <h2 class="text-sm font-bold text-white flex items-center gap-2">
            近十日候選標的 ‧ 最佳進場區達成監控
            <span class="text-[9px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30">近10日動態跟蹤</span>
          </h2>
          <p class="text-[11px] text-slate-400 mt-0.5">回測落入進場區且未破停損者自動帶入；跌破停損立刻永久剔除，除非後續再次重新突破上榜。</p>
        </div>
      </div>
      <div id="entry-zone-list" class="mt-3"></div>
    </div>
    <section class="rounded-2xl bg-slate-900/90 border border-slate-800 p-4 sm:p-6 shadow-md">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800/80">
        <div class="flex items-center gap-2">
          <i data-lucide="activity" class="w-4 h-4 text-indigo-400"></i>
          <h2 class="text-sm sm:text-base font-bold text-white" id="macro-section-title">一、今日市場結論與大盤價量結構</h2>
        </div>
        <span id="label-market-date" class="text-xs font-mono font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">--</span>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-4 mb-4" id="macro-index-grid"></div>
      <div class="space-y-2">
        <div class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
          <i data-lucide="layers" class="w-3.5 h-3.5 text-indigo-400"></i>
          <span>強勢族群評定：</span>
        </div>
        <div id="market-sectors-container" class="flex flex-wrap gap-1.5"></div>
      </div>
    </section>
    <section class="rounded-2xl bg-slate-900/90 border border-slate-800 p-4 sm:p-6 shadow-md">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800/80">
        <div class="flex items-center gap-2">
          <i data-lucide="list-ordered" class="w-4 h-4 text-indigo-400"></i>
          <h2 class="text-sm sm:text-base font-bold text-white">二、精選候選股總表（綜合評分排序）</h2>
        </div>
        <div class="text-[11px] text-slate-400">硬性條件：漲幅 ≥ 8.5% ‧ 放量 ≥ 1.8倍 ‧ 均線多頭 ‧ 箱型突破</div>
      </div>
      <div id="candidates-table-wrapper" class="overflow-x-auto"></div>
    </section>
    <section class="space-y-3">
      <div class="flex items-center gap-2 px-1">
        <i data-lucide="microscope" class="w-4 h-4 text-indigo-400"></i>
        <h2 class="text-sm sm:text-base font-bold text-white">三、逐檔技術架構、均線、箱型與 Fibonacci 深度解構</h2>
      </div>
      <div id="candidate-cards-container" class="space-y-4"></div>
    </section>
  </main>
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-slate-900 border border-indigo-500/50 text-white shadow-2xl text-xs font-semibold">
    <i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-msg">已載入最新真實數據</span>
  </div>
</body>
</html>
