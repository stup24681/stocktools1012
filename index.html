    function computeDynamicTargetText(c) {
      if (c.targetPrice && c.targetPrice !== "--") {
        return c.targetPrice;
      }
      var closeVal = parseFloat(c.close);
      if (!isNaN(closeVal) && c.boxRange) {
        var parts = String(c.boxRange).split("～");
        if (parts.length === 2) {
          var low = parseFloat(parts[0].trim());
          var high = parseFloat(parts[1].trim());
          if (!isNaN(low) && !isNaN(high) && high > low) {
            var boxH = high - low;
            var tp1 = (closeVal + boxH * 0.382).toFixed(1);
            var tp2 = (high + boxH).toFixed(1);
            return "第一停利 " + tp1 + " 元 (減碼半數) / 第二停利 " + tp2 + " 元 (箱型1:1滿足，或破 5MA 移動停利)";
          }
        }
      }
      if (!isNaN(closeVal)) {
        return "第一停利 " + (closeVal * 1.12).toFixed(1) + " 元 / 第二停利 " + (closeVal * 1.25).toFixed(1) + " 元 (破 5MA 移動停利)";
      }
      return "破 5 日均線移動停利";
    }

          newsSection +
          valSection +
          '<div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">' +
            '<div class="p-3 rounded-xl bg-slate-950/70 border border-slate-800/80 space-y-1.5">' +
              '<div class="font-bold text-slate-300 flex items-center gap-1.5">📈 <span>技術面與均線架構</span></div>' +
              '<div class="text-slate-400 leading-relaxed">' + c.maStatus + '</div>' +
              '<div class="text-indigo-300 pt-1">突破結構：' + c.boxDays + ' (平台 ' + c.boxRange + ')</div>' +
            '</div>' +
            '<div class="p-3 rounded-xl bg-slate-950/70 border border-slate-800/80 space-y-1.5">' +
              '<div class="font-bold text-slate-300 flex items-center gap-1.5">🎯 <span>點位規劃與出場停利目標</span></div>' +
              '<div class="text-emerald-300 font-bold">技術進場區：' + c.entryZone + ' (核心 ' + c.entryPrice + ')</div>' +
              '<div class="text-rose-400 font-bold">停損防線：' + c.stopLossPrice + '</div>' +
              '<div class="text-amber-300 font-bold">出場停利點：' + resolvedTarget + '</div>' +
            '</div>' +
          '</div>' +
          leadTimeSection +
          '<div class="text-xs text-slate-400 bg-slate-950/40 p-2.5 rounded-lg border border-slate-800/50">' +
            '<span class="text-rose-400 font-semibold">⚠️ 禁買/防守條件：</span>' + c.noBuyCondition +
          '</div>';

        container.appendChild(card);
      });
    }

    function fetchLiveDataJson(isManual) {
      var badge = document.getElementById('badge-api-status');
      if (badge) {
        badge.innerText = "連線檢查中...";
        badge.className = "text-[10px] px-2 py-0.5 rounded-full font-medium bg-amber-500/20 text-amber-300 border border-amber-500/40";
      }

      fetch('./data.json?_t=' + new Date().getTime(), { cache: 'no-store' })
        .then(function(res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function(remoteJson) {
          if (remoteJson && typeof remoteJson === 'object') {
            for (var m in remoteJson) {
              if (remoteJson[m]) {
                if (!appState.db[m]) appState.db[m] = {};
                for (var d in remoteJson[m]) {
                  appState.db[m][d] = remoteJson[m][d];
                }
              }
            }
            var curDates = Object.keys(appState.db[appState.currentMarket] || {}).sort().reverse();
            if (curDates.length > 0) {
              appState.activeDate = curDates[0];
            }
          }
          if (badge) {
            badge.innerText = isManual ? "雲端最新數據已同步" : "雲端即時連線 (最新)";
            badge.className = "text-[10px] px-2 py-0.5 rounded-full font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 badge-glow";
          }
          renderActiveView();
        })
        .catch(function(err) {
          if (badge) {
            badge.innerText = isManual ? "無新雲端檔 (使用基準)" : "實盤核實基準 (快照)";
            badge.className = "text-[10px] px-2 py-0.5 rounded-full font-medium bg-slate-800 text-slate-300 border border-slate-700";
          }
        });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
